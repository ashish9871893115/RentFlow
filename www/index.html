<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RentFlow</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mu:#66727f;--pr:#0f766e;--prt:#fff;--ok:#15803d;--okb:#dcfce7;--bad:#b91c1c;--badb:#fee2e2;--wn:#a16207;--wnb:#fef3c7;--bd:#e3e8ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1419;--card:#18212a;--tx:#e8eef3;--mu:#93a1ae;--pr:#2dd4bf;--prt:#06201d;--ok:#4ade80;--okb:#14351f;--bad:#f87171;--badb:#3b1a1a;--wn:#fbbf24;--wnb:#3a2f10;--bd:#26323d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1419;--card:#18212a;--tx:#e8eef3;--mu:#93a1ae;--pr:#2dd4bf;--prt:#06201d;--ok:#4ade80;--okb:#14351f;--bad:#f87171;--badb:#3b1a1a;--wn:#fbbf24;--wnb:#3a2f10;--bd:#26323d;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
header{padding:14px 16px 6px;font-weight:700;font-size:20px}header small{display:block;font-weight:400;color:var(--mu);font-size:12px}
main{flex:1;overflow-y:auto;padding:8px 16px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid .card{margin:0}.big{font-size:22px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600}
.paid{background:var(--okb);color:var(--ok)}.due{background:var(--badb);color:var(--bad)}.soon{background:var(--wnb);color:var(--wn)}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--pr);color:var(--prt);font-weight:600}
button.s{background:transparent;color:var(--pr);border:1px solid var(--pr);padding:6px 10px}
button.w{width:100%}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}
input,select{width:100%;font:inherit;padding:9px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
nav{display:flex;border-top:1px solid var(--bd);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:10px 0;font-size:12px}
nav button.on{color:var(--pr)}nav b{display:block;font-size:18px}
h3{margin:14px 0 8px;font-size:15px}.note{font-size:12px;color:var(--mu);margin-top:8px}
</style></head><body>
<header id="hd"></header><main id="m"></main>
<nav id="nv"></nav>
<script>
var D;try{D=JSON.parse(localStorage.getItem("rf1"))}catch(x){}
if(!D||!D.T)D={T:[
{id:1,n:"Amit Sharma",u:"Room 101",p:"Green View",r:12000,paid:12000,how:"UPI"},
{id:2,n:"Priya Nair",u:"Room 102",p:"Green View",r:15000,paid:0},
{id:3,n:"Sunita Rao",u:"Flat 2A",p:"Sunrise Apts",r:22000,paid:10000,how:"Cash"}],
P:[{n:"Green View",units:6},{n:"Sunrise Apts",units:6}],
B:[{t:"Electricity",p:"Green View",amt:4250,due:"20 Nov 2026",units:330}]};
var T=D.T,P=D.P,B=D.B,tab="home",draft=null,scanning=false,fm=null;
var tabs=[["home","⌂","Home"],["prop","▦","Property"],["rent","₹","Rent"],["bills","⚡","Bills"],["me","☺","Profile"]];
function sv(){try{localStorage.setItem("rf1",JSON.stringify(D))}catch(x){}}
function g(i){return document.getElementById(i).value}
function e(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function f(x){return"₹"+x.toLocaleString("en-IN")}
function sum(k){return T.reduce(function(a,t){return a+t[k]},0)}
function st(t){return t.paid>=t.r?'<span class="chip paid">Paid</span>':t.paid>0?'<span class="chip soon">Partial</span>':'<span class="chip due">Pending</span>'}
function btns(a,b){return'<div class="row" style="margin-top:12px;gap:8px"><button class="w" onclick="'+a+'">Save</button><button class="s" onclick="'+b+'">Cancel</button></div>'}
function po(s){return P.map(function(p){return"<option"+(p.n==s?" selected":"")+">"+e(p.n)+"</option>"}).join("")}
function home(){var tot=sum("r"),col=sum("paid"),exp=B.reduce(function(a,b){return a+b.amt},0),pc=tot?Math.round(col/tot*100):0;
return'<div class="grid"><div class="card"><div class="mu">Monthly rent</div><div class="big">'+f(tot)+'</div></div><div class="card"><div class="mu">Collected</div><div class="big" style="color:var(--ok)">'+f(col)+'</div></div><div class="card"><div class="mu">Pending</div><div class="big" style="color:var(--bad)">'+f(tot-col)+'</div></div><div class="card"><div class="mu">Net income</div><div class="big">'+f(col-exp)+'</div></div></div>'
+'<div class="card"><div class="row"><span class="mu">Collection</span><b>'+pc+'%</b></div><div style="height:8px;border-radius:9px;background:var(--bd);margin-top:8px"><div style="height:8px;border-radius:9px;background:var(--pr);width:'+pc+'%"></div></div></div>'
+'<h3>Bills</h3>'+(B.length?B.slice(0,4).map(function(b){return'<div class="card row"><div><b>'+e(b.t)+'</b><div class="mu">'+e(b.p)+' · due '+e(b.due)+'</div></div><b>'+f(b.amt)+'</b></div>'}).join(""):'<div class="note">No bills yet.</div>')}
function prop(){var h='<button class="w" onclick="fm=\'prop\';draw()">+ Add property</button>';
if(fm=="prop")h+='<div class="card" style="margin-top:12px"><b>New property</b><label>Name</label><input id="pn"><label>Number of units</label><input id="pu" type="number" value="4">'+btns("addP()","fm=null;draw()")+'</div>';
return h+'<div style="height:12px"></div>'+P.map(function(p,i){var ts=T.filter(function(t){return t.p==p.n});
return'<div class="card"><div class="row"><b>'+e(p.n)+'</b><span class="mu">'+ts.length+" of "+p.units+' occupied</span></div>'+ts.map(function(t){return'<div class="row mu" style="margin-top:6px"><span>'+e(t.u)+" · "+e(t.n)+'</span><span>'+f(t.r)+'</span></div>'}).join("")+'<div class="row" style="margin-top:10px"><span class="mu">'+Math.max(0,p.units-ts.length)+' vacant</span><button class="s" onclick="delP('+i+')">Delete</button></div></div>'}).join("")}
function addP(){var n=g("pn").trim(),u=+g("pu");if(!n||u<1){alert("Enter a name and number of units.");return}P.push({n:n,units:u});fm=null;sv();draw()}
function delP(i){if(!confirm("Delete this property and its tenants?"))return;var n=P[i].n;P.splice(i,1);for(var k=T.length-1;k>=0;k--)if(T[k].p==n)T.splice(k,1);sv();draw()}
function tf(t){t=t||{n:"",u:"",p:P[0]?P[0].n:"",r:""};
return'<div class="card" style="margin-top:12px"><b>'+(t.id?"Edit tenant":"New tenant")+'</b><label>Name</label><input id="tn" value="'+e(t.n)+'"><label>Unit (e.g. Room 101)</label><input id="tu" value="'+e(t.u)+'"><label>Property</label><select id="tp">'+po(t.p)+'</select><label>Monthly rent (₹)</label><input id="tr" type="number" value="'+t.r+'">'+btns("saveT("+(t.id||0)+")","fm=null;draw()")+'</div>'}
function saveT(id){var n=g("tn").trim(),r=+g("tr");if(!n||!r||!P.length){alert("Add a property first, then enter a name and rent.");return}
if(id){var t=T.filter(function(x){return x.id==id})[0];t.n=n;t.u=g("tu");t.p=g("tp");t.r=r;if(t.paid>r)t.paid=r}else T.push({id:Date.now(),n:n,u:g("tu"),p:g("tp"),r:r,paid:0});fm=null;sv();draw()}
function delT(id){if(!confirm("Remove this tenant?"))return;for(var k=0;k<T.length;k++)if(T[k].id==id){T.splice(k,1);break}sv();draw()}
function newMonth(){if(!confirm("Start a new month? All payments reset to pending."))return;T.forEach(function(t){t.paid=0;t.how=""});sv();draw()}
function pay(id){var t=T.filter(function(x){return x.id==id})[0],bal=t.r-t.paid,a=+g("a"+id)||bal;t.paid=Math.min(t.r,t.paid+a);t.how=g("m"+id);sv();draw()}
function rent(){var h='<div class="row" style="gap:8px"><button class="w" onclick="fm=\'ten\';draw()">+ Add tenant</button><button class="s" onclick="newMonth()">New month</button></div>';
if(fm=="ten")h+=tf();
if(!T.length)h+='<div class="note">No tenants yet. Add a property first, then add tenants.</div>';
return h+'<div style="height:12px"></div>'+T.map(function(t){if(fm=="e"+t.id)return tf(t);var bal=t.r-t.paid;
return'<div class="card"><div class="row"><div><b>'+e(t.n)+'</b><div class="mu">'+e(t.u)+" · "+e(t.p)+'</div></div>'+st(t)+'</div><div class="mu" style="margin-top:8px">Rent '+f(t.r)+" · Balance "+f(bal)+'</div>'
+(bal>0?'<div class="row" style="margin-top:8px;gap:6px"><input id="a'+t.id+'" type="number" placeholder="'+bal+'" style="width:100px"><select id="m'+t.id+'" style="width:auto"><option>Cash</option><option>UPI</option><option>Bank</option></select><button onclick="pay('+t.id+')">Record</button></div>':'<div class="mu" style="margin-top:6px">Received via '+e(t.how||"")+'</div>')
+'<div class="row" style="margin-top:8px;gap:6px;justify-content:flex-end"><button class="s" onclick="fm=\'e'+t.id+'\';draw()">Edit</button><button class="s" onclick="delT('+t.id+')">Remove</button></div></div>'}).join("")}
function bills(){var h='<div class="row" style="gap:8px"><button class="w" onclick="document.getElementById(\'fi\').click()">Scan new bill</button><button class="s" onclick="manual()">Add manually</button></div><input id="fi" type="file" accept="image/*,application/pdf" capture="environment" hidden onchange="scan()">';
if(scanning)h+='<div class="card" style="margin-top:12px">Reading bill…</div>';
if(draft){var d=draft,ty=["Electricity","Water","Gas","Maintenance","Other"];h+='<div class="card" style="margin-top:12px"><b>Verify bill details</b><div class="note">Scanned values are demo samples. Real OCR needs a backend.</div>'
+'<label>Type</label><select id="bt">'+ty.map(function(x){return"<option"+(x==d.t?" selected":"")+">"+x+"</option>"}).join("")+'</select>'
+'<label>Property</label><select id="bp">'+po("")+'</select>'
+'<label>Consumer number</label><input id="bc" value="'+e(d.c)+'">'
+'<label>Previous reading</label><input id="b1" type="number" value="'+d.a+'" oninput="cu()">'
+'<label>Current reading</label><input id="b2" type="number" value="'+d.b+'" oninput="cu()">'
+'<div class="mu" style="margin-top:6px">Units consumed: <b id="bu">'+(d.b-d.a)+'</b></div>'
+'<label>Bill amount (₹)</label><input id="ba" type="number" value="'+d.m+'">'
+'<label>Due date</label><input id="bd" value="'+e(d.d)+'">'+btns("saveB()","draft=null;draw()")+'</div>'}
return h+'<h3>Saved bills</h3>'+(B.length?B.map(function(b,i){return'<div class="card"><div class="row"><div><b>'+e(b.t)+'</b><div class="mu">'+e(b.p)+" · due "+e(b.due)+(b.units?" · "+b.units+" units":"")+'</div></div><b>'+f(b.amt)+'</b></div><div class="row" style="margin-top:8px;justify-content:flex-end"><button class="s" onclick="delB('+i+')">Delete</button></div></div>'}).join(""):'<div class="note">No bills saved.</div>')}
function scan(){scanning=true;draw();setTimeout(function(){scanning=false;draft={t:"Electricity",c:"123456789",a:12450,b:12780,m:3850,d:"25 Nov 2026"};draw()},1200)}
function manual(){draft={t:"Electricity",c:"",a:0,b:0,m:"",d:""};draw()}
function cu(){document.getElementById("bu").textContent=(+g("b2"))-(+g("b1"))}
function saveB(){if(!P.length){alert("Add a property first.");return}var m=+g("ba");if(!m){alert("Enter the bill amount.");return}
B.unshift({t:g("bt"),p:g("bp"),amt:m,due:g("bd"),units:Math.max(0,(+g("b2"))-(+g("b1")))});draft=null;sv();draw()}
function delB(i){if(!confirm("Delete this bill?"))return;B.splice(i,1);sv();draw()}
function clr(){if(!confirm("Delete ALL properties, tenants and bills?"))return;T.length=0;P.length=0;B.length=0;sv();draw()}
function me(){return'<div class="card"><b>Landlord account</b><div class="mu">Plan: Free (demo)</div></div><div class="card"><b>Reminders and reports</b><div class="mu">WhatsApp/SMS reminders and PDF/Excel exports are planned for a later version.</div></div><div class="card"><b>Your data</b><div class="mu">Saved on this phone only.</div><button class="s" style="margin-top:10px" onclick="clr()">Clear all data</button></div>'}
function draw(){var v={home:home,prop:prop,rent:rent,bills:bills,me:me};
document.getElementById("hd").innerHTML="RentFlow<small>"+tabs.filter(function(x){return x[0]==tab})[0][2]+"</small>";
document.getElementById("m").innerHTML=v[tab]();
document.getElementById("nv").innerHTML=tabs.map(function(x){return'<button class="'+(x[0]==tab?"on":"")+'" onclick="tab=\''+x[0]+'\';fm=null;draft=null;draw()"><b>'+x[1]+"</b>"+x[2]+"</button>"}).join("")}
draw();
</script></body></html>
